spring.application.name=IWS_APP

server.port=8080

# SQL Server
# encrypt=false prevents SSL handshake errors on self-signed/no-cert setups
spring.datasource.url=jdbc:sqlserver://localhost:1412;databaseName=IWSDB;trustServerCertificate=true;encrypt=false
spring.datasource.username=sa
spring.datasource.password=StrongPassword@123
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Flyway
spring.flyway.locations=classpath:db/migration

spring.flyway.enabled=true

spring.flyway.baseline-on-migrate=true

#JWT
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration=7200000

#spring.datasource.hikari.maximum-pool-size=80
#spring.datasource.hikari.minimum-idle=20
#spring.datasource.hikari.connection-timeout=30000

spring.datasource.hikari.maximum-pool-size=120
#spring.datasource.hikari.maximum-pool-size=100
spring.datasource.hikari.minimum-idle=20
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

server.tomcat.threads.max=200
server.tomcat.threads.min-spare=20