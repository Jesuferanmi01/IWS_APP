spring.application.name=IWS_APP

server.port=8080

# SQL Server
# encrypt=false prevents SSL handshake errors on self-signed/no-cert setups
spring.datasource.url=jdbc:sqlserver://localhost:1412;databaseName=IWSDB;trustServerCertificate=true;encrypt=false
spring.datasource.username=sa
spring.datasource.password=StrongPassword@123
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Flyway
spring.flyway.locations=classpath:db/migration

spring.flyway.enabled=true

spring.flyway.baseline-on-migrate=true

